name: Verify and deploy website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      benchmark:
        description: Optional CI runtime comparison on the same commit
        type: choice
        default: none
        options:
          - none
          - direct-install
          - single-browser
          - two-workers
          - two-shards
          - shared-build
          - fully-parallel
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require the production submission endpoint
        env:
          VITE_REVIEW_SUBMISSION_URL: ${{ vars.VITE_REVIEW_SUBMISSION_URL }}
        run: |
          if test -z "$VITE_REVIEW_SUBMISSION_URL"; then
            echo "::error::Set the repository Actions variable VITE_REVIEW_SUBMISSION_URL before publishing Pages."
            exit 1
          fi
      - run: npm run lint
      - name: Check GitHub Actions workflow
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
  browser-tests:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Make the container home usable by Firefox
        run: chown "$(id -u):$(id -g)" /github/home
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check browser image matches the installed Playwright version
        run: test "$(node -p 'require("playwright/package.json").version')" = '1.63.0'
      - run: npm run typecheck
      - run: npm run worker:check
        if: matrix.shard == 1
      - run: npm test -- --workers=4 --shard=${{ matrix.shard }}/4
      - name: Summarize browser timings
        if: ${{ !cancelled() }}
        run: |
          if test -f playwright-timings/results.json; then
            node scripts/summarize-playwright-timings.mjs playwright-timings/results.json | tee playwright-timings/summary.md
            cat playwright-timings/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload browser timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-timings-${{ github.run_id }}-${{ matrix.shard }}
          path: playwright-timings/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run build
        env:
          VITE_REVIEW_SUBMISSION_URL: ${{ vars.VITE_REVIEW_SUBMISSION_URL }}
        if: github.ref == 'refs/heads/main' && matrix.shard == 1
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && matrix.shard == 1
        with:
          path: dist
  benchmark-direct-install:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark == 'direct-install' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run typecheck
      - run: npm test -- --workers=4 --shard=${{ matrix.shard }}/4
      - name: Upload benchmark timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-timings-${{ github.run_id }}-${{ matrix.shard }}
          path: playwright-timings/
          if-no-files-found: ignore
          retention-days: 14
  benchmark-single-browser:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark == 'single-browser' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [unit, chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.project == 'unit' && 'chromium' || matrix.project }}
      - run: npm run typecheck
      - run: npm test -- --workers=4 --project=${{ matrix.project }}
      - name: Upload benchmark timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-timings-${{ github.run_id }}-${{ matrix.project }}
          path: playwright-timings/
          if-no-files-found: ignore
          retention-days: 14
  benchmark-two-workers:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark == 'two-workers' }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - run: chown "$(id -u):$(id -g)" /github/home
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --workers=2 --shard=${{ matrix.shard }}/4
      - name: Upload benchmark timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-timings-${{ github.run_id }}-${{ matrix.shard }}
          path: playwright-timings/
          if-no-files-found: ignore
          retention-days: 14
  benchmark-two-shards:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark == 'two-shards' }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - run: chown "$(id -u):$(id -g)" /github/home
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --workers=4 --shard=${{ matrix.shard }}/2
      - name: Upload benchmark timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-timings-${{ github.run_id }}-${{ matrix.shard }}
          path: playwright-timings/
          if-no-files-found: ignore
          retention-days: 14
  benchmark-build:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark == 'shared-build' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-dist-${{ github.run_id }}
          path: dist/
          retention-days: 1
  benchmark-shared-build:
    needs: benchmark-build
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - run: chown "$(id -u):$(id -g)" /github/home
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-dist-${{ github.run_id }}
          path: dist/
      - run: npm test -- --workers=4 --shard=${{ matrix.shard }}/4
        env:
          PW_PREBUILT_DIST: "1"
      - name: Upload benchmark timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-timings-${{ github.run_id }}-${{ matrix.shard }}
          path: playwright-timings/
          if-no-files-found: ignore
          retention-days: 14
  benchmark-fully-parallel:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark == 'fully-parallel' }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - run: chown "$(id -u):$(id -g)" /github/home
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --workers=4 --fully-parallel --shard=${{ matrix.shard }}/4
      - name: Upload benchmark timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-timings-${{ github.run_id }}-${{ matrix.shard }}
          path: playwright-timings/
          if-no-files-found: ignore
          retention-days: 14
  verify:
    if: ${{ always() }}
    needs: [browser-tests, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Require the lint and every browser shard to pass
        env:
          SHARD_RESULT: ${{ needs.browser-tests.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: test "$SHARD_RESULT" = success && test "$LINT_RESULT" = success
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
